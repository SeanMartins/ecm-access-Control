<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="bingbot" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ECM — Accesso Operatori</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0D0F14;--surface:#13161F;--surface2:#1C2030;--border:#2A2E45;--border2:#363C58;--text:#F0F2FF;--text2:#8B93B8;--text3:#4A5070;--accent:#4D6EFF;--success:#22C97A;--danger:#FF4D4D;--warn:#FFB547;--radius:12px;--radius-lg:20px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(77,110,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(77,110,255,.04) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
.bg-glow{position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(77,110,255,.07) 0%,transparent 70%);top:-150px;left:-100px;pointer-events:none}
.login-card{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:44px 38px;width:100%;max-width:400px;box-shadow:0 24px 80px rgba(0,0,0,.4)}
.logo-mark{width:50px;height:50px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:white;margin:0 auto 20px}
.login-title{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px;text-align:center}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px;text-align:center;line-height:1.5}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
label{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text2);text-transform:uppercase}
input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;width:100%}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,110,255,.12)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:42px}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px}
.login-btn{width:100%;padding:13px;border-radius:var(--radius);border:none;background:var(--accent);color:white;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s;margin-top:6px}
.login-btn:hover{background:#3a58e0}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.status-msg{text-align:center;font-size:13px;color:var(--text2);margin-top:14px;min-height:18px;line-height:1.4}
.status-msg.err{color:var(--danger)}
.status-msg.ok{color:var(--success)}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text3);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:var(--radius);border:1px solid var(--border2);background:white;color:#1A1714;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.google-btn:hover{box-shadow:0 4px 16px rgba(0,0,0,.2)}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.2);border-top-color:white;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.role-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;margin:0 auto 16px;display:flex;width:fit-content}
.chip-op{background:rgba(77,110,255,.12);color:var(--accent);border:1px solid rgba(77,110,255,.2)}
.chip-sc{background:rgba(34,201,122,.12);color:var(--success);border:1px solid rgba(34,201,122,.2)}
.chip-rp{background:rgba(255,181,71,.12);color:var(--warn);border:1px solid rgba(255,181,71,.2)}

/* RESPONSIVE AUTO-SIZING */

@media(max-width:480px){
  .login-card{padding:30px 20px}
  .login-title{font-size:20px}
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="login-card">
  <div class="logo-mark">E</div>
  <div class="login-title">ECM Access Control</div>
  <div class="login-sub">Accesso operatori — inserisci le credenziali fornite dall'amministratore</div>

  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="es. mario.rossi" autocomplete="username" autocapitalize="none">
  </div>
  <div class="form-group">
    <label>Password</label>
    <div class="pw-wrap">
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <button class="pw-toggle" type="button" id="pwToggle">👁</button>
    </div>
  </div>

  <button class="login-btn" id="loginBtn" onclick="doLogin()">Accedi</button>
  <div class="status-msg" id="statusMsg"></div>

  <div class="divider">oppure</div>

  <button class="google-btn" onclick="doGoogleLogin()">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Accedi con Google (Admin)
  </button>
</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const FB={apiKey:"AIzaSyBfq6dHq7JQRC2AtBf7obTM6End2NftwxA",authDomain:"ecm-access-control.firebaseapp.com",projectId:"ecm-access-control",storageBucket:"ecm-access-control.firebasestorage.app",messagingSenderId:"727782311741",appId:"1:727782311741:web:4aaf570b1a05caf4192754"};
const app=getApps().length?getApps()[0]:initializeApp(FB);
const db=getFirestore(app);
const auth=getAuth(app);

// Se già loggato con Google vai alla home
onAuthStateChanged(auth, user=>{
  if(user) window.location.href='ecm-home.html';
});

// Enter per login
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('username').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('password').focus();});
document.getElementById('pwToggle').addEventListener('click',()=>{
  const inp=document.getElementById('password');
  inp.type=inp.type==='password'?'text':'password';
});

async function hashPassword(pw){
  const enc=new TextEncoder().encode(pw+'ECM_SALT_2025');
  const buf=await crypto.subtle.digest('SHA-256',enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

window.doLogin = async function(){
  const username=document.getElementById('username').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  const msg=document.getElementById('statusMsg');
  const btn=document.getElementById('loginBtn');

  if(!username||!password){msg.textContent='Inserisci username e password.';msg.className='status-msg err';return;}

  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Verifica...';
  msg.textContent='';msg.className='status-msg';

  try{
    const pwHash=await hashPassword(password);
    const snap=await getDocs(collection(db,'utenti'));
    let found=null;
    snap.forEach(d=>{const u=d.data();if(u.username===username&&u.pwHash===pwHash&&u.attivo!==false)found={id:d.id,...u};});

    if(!found){
      msg.textContent='Username o password non corretti.';msg.className='status-msg err';
      btn.disabled=false;btn.textContent='Accedi';return;
    }

    // Verifica scadenza
    if(new Date(found.scadenza)<new Date()){
      msg.textContent='⚠️ Le tue credenziali sono scadute. Contatta l\'amministratore.';msg.className='status-msg err';
      btn.disabled=false;btn.textContent='Accedi';return;
    }

    // Salva sessione operatore in localStorage
    localStorage.setItem('ecm_op_user', JSON.stringify({
      uid:found.id, username:found.username, nome:found.nome,
      ruolo:found.ruolo, scadenza:found.scadenza, loginAt:new Date().toISOString()
    }));

    msg.textContent='✓ Accesso effettuato!';msg.className='status-msg ok';

    // Reindirizza in base al ruolo
    setTimeout(()=>{
      // Scanner e operatori vanno alla lista eventi per scegliere l'evento
      const redirect=sessionStorage.getItem('ecm_redirect_after_login')||'ecm-eventi.html';
      sessionStorage.removeItem('ecm_redirect_after_login');
      window.location.href=redirect;
    },800);

  }catch(err){
    console.error(err);
    msg.textContent='Errore di connessione: '+err.message;msg.className='status-msg err';
    btn.disabled=false;btn.textContent='Accedi';
  }
};

window.doGoogleLogin = async function(){
  try{
    await signInWithPopup(auth, new GoogleAuthProvider());
    // Torna alla pagina da cui veniva, o agli eventi
    const redirect = sessionStorage.getItem('ecm_redirect_after_login') || 'ecm-eventi.html';
    sessionStorage.removeItem('ecm_redirect_after_login');
    window.location.href = redirect;
  }catch(e){
    if(e.code!=='auth/popup-closed-by-user'){
      document.getElementById('statusMsg').textContent='Errore Google: '+e.message;
      document.getElementById('statusMsg').className='status-msg err';
    }
  }
};
</script>
</body>
</html>
