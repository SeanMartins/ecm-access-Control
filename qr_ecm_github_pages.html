
<div style="padding:2rem 0;display:flex;flex-direction:column;align-items:center;gap:1.5rem">
  <div style="text-align:center">
    <div style="font-size:13px;font-weight:500;color:var(--color-text-secondary);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px">ECM Access Control</div>
    <div style="font-size:11px;color:var(--color-text-tertiary);font-family:var(--font-mono)">seanmartins.github.io/ecm-access-Control/</div>
  </div>
  <div id="qrWrap" style="background:white;padding:16px;border-radius:12px;border:1px solid var(--color-border-tertiary)"></div>
  <div style="font-size:12px;color:var(--color-text-tertiary);text-align:center">Scansiona con qualsiasi fotocamera per aprire la home</div>
  <button onclick="printQR()" style="display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:8px;border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-family:var(--font-sans);font-size:13px;cursor:pointer">🖨️ Stampa QR</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
new QRCode(document.getElementById('qrWrap'), {
  text: 'https://seanmartins.github.io/ecm-access-Control/',
  width: 220,
  height: 220,
  correctLevel: QRCode.CorrectLevel.M
});
function printQR(){
  const canvas = document.querySelector('#qrWrap canvas');
  if(!canvas){alert('QR non ancora generato');return;}
  const w = window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>QR ECM</title>
  <style>body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;background:white}
  .label{font-size:13px;color:#666;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
  .url{font-size:10px;color:#999;font-family:monospace;margin-top:8px}
  @media print{button{display:none}}</style></head><body>
  <div class="label">ECM Access Control</div>
  <img src="${canvas.toDataURL()}" width="220" height="220">
  <div class="url">seanmartins.github.io/ecm-access-Control/</div>
  <button onclick="window.print()" style="margin-top:20px;padding:8px 20px;cursor:pointer">Stampa</button>
  </body></html>`);
  w.document.close();
}
</script>
