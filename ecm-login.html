<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ECM Access Control — Accedi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0D0F14;--surface:#13161F;--surface2:#1C2030;--border:#2A2E45;--border2:#363C58;--text:#F0F2FF;--text2:#8B93B8;--text3:#4A5070;--accent:#4D6EFF;--success:#22C97A;--danger:#FF4D4D;--radius:12px;--radius-lg:20px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(77,110,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(77,110,255,.04) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
.bg-glow{position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(77,110,255,.07) 0%,transparent 70%);top:-150px;left:-100px;pointer-events:none}
.login-card{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:48px 40px;width:100%;max-width:420px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.4)}
.logo-mark{width:52px;height:52px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:white;margin:0 auto 24px}
.login-title{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.login-sub{font-size:14px;color:var(--text2);margin-bottom:36px;line-height:1.6}
.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px 20px;border-radius:var(--radius);border:1px solid var(--border2);background:white;color:#1A1714;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s}
.google-btn:hover{box-shadow:0 4px 20px rgba(0,0,0,.3);transform:translateY(-1px)}
.google-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.google-icon{width:20px;height:20px;flex-shrink:0}
.divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--text3);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.info-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;text-align:left;margin-top:24px}
.info-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2);margin-bottom:8px}
.info-row:last-child{margin-bottom:0}
.info-dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex-shrink:0}
.status-msg{margin-top:20px;font-size:13px;color:var(--text2);min-height:20px}
.status-msg.err{color:var(--danger)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* RESPONSIVE AUTO-SIZING */

@media(max-width:480px){
  .login-card{padding:32px 22px}
  .login-title{font-size:20px}
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="login-card">
  <div class="logo-mark">E</div>
  <div class="login-title">ECM Access Control</div>
  <div class="login-sub">Accedi con il tuo account Google per gestire gli eventi ECM in modo sicuro</div>
  <button class="google-btn" id="googleBtn" onclick="signInGoogle()">
    <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Accedi con Google
  </button>
  <div class="status-msg" id="statusMsg"></div>
  <div class="info-box">
    <div class="info-row"><div class="info-dot"></div>Solo gli account Google autorizzati possono accedere</div>
    <div class="info-row"><div class="info-dot"></div>I dati sono protetti su Firebase Firestore</div>
    <div class="info-row"><div class="info-dot"></div>Nessuna password da ricordare</div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const FB={apiKey:"AIzaSyBfq6dHq7JQRC2AtBf7obTM6End2NftwxA",authDomain:"ecm-access-control.firebaseapp.com",projectId:"ecm-access-control",storageBucket:"ecm-access-control.firebasestorage.app",messagingSenderId:"727782311741",appId:"1:727782311741:web:4aaf570b1a05caf4192754"};
const app=initializeApp(FB);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();

// Se già loggato, vai direttamente alla home
onAuthStateChanged(auth, user => {
  if(user){
    window.location.href='ecm-home.html';
  }
});

window.signInGoogle = async function(){
  const btn=document.getElementById('googleBtn');
  const msg=document.getElementById('statusMsg');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> Accesso in corso...';
  msg.textContent='';msg.className='status-msg';
  try{
    await signInWithPopup(auth, provider);
    msg.textContent='✓ Accesso effettuato! Reindirizzamento...';
    msg.style.color='var(--success)';
    window.location.href='ecm-home.html';
  }catch(err){
    console.error(err);
    btn.disabled=false;
    btn.innerHTML=`<svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Accedi con Google`;
    if(err.code==='auth/popup-closed-by-user'){msg.textContent='Accesso annullato.';}
    else if(err.code==='auth/unauthorized-domain'){msg.textContent='⚠️ Dominio non autorizzato. Aggiungi seanmartins.github.io in Firebase Console → Authentication → Authorized domains';msg.className='status-msg err';}
    else{msg.textContent='Errore: '+err.message;msg.className='status-msg err';}
  }
};
</script>
</body>
</html>
