<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ECM Access Control — Login</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#2563EB;--danger:#DC2626;--success:#059669;--text:#1A1D2E;--text2:#5A5F7A;--text3:#9499B0;--border:#DDE1E9;--surface:#FFF;--surface2:#F0F2F5;--bg:#F4F6F9;--radius:10px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:linear-gradient(135deg,#1A1D2E 0%,#2D3561 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:white;border-radius:20px;padding:40px;max-width:420px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.4)}
.logo-wrap{text-align:center;margin-bottom:28px}
.logo-wrap img{width:72px;height:72px;border-radius:16px;margin-bottom:12px}
.app-title{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.02em}
.app-sub{font-size:13px;color:var(--text3);margin-top:4px}
.form-group{margin-bottom:14px}
.field-label{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text2);text-transform:uppercase;display:block;margin-bottom:6px}
.form-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);outline:none;width:100%;transition:border-color .2s,background .2s}
.form-input:focus{border-color:var(--accent);background:white;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.pwd-wrap{position:relative}
.pwd-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--text3);padding:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:var(--radius);font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;border:none;width:100%;transition:all .2s}
.btn-primary{background:var(--accent);color:white}.btn-primary:hover{background:#1d4ed8}
.btn-google{background:white;color:var(--text);border:1px solid var(--border)}.btn-google:hover{background:var(--surface2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.divider-text{font-size:12px;color:var(--text3)}
.alert{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;display:none}
.alert-error{background:#FEF2F2;color:var(--danger);border:1px solid rgba(220,38,38,.2)}
.alert-info{background:#EFF6FF;color:var(--accent);border:1px solid rgba(37,99,235,.2)}
.forgot-link{text-align:right;margin-top:6px}
.forgot-link a{font-size:12px;color:var(--accent);text-decoration:none}.forgot-link a:hover{text-decoration:underline}
.footer-login{text-align:center;margin-top:24px;font-size:11px;color:var(--text3)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.role-info{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface2);border-radius:var(--radius);font-size:12px;color:var(--text2);margin-top:16px}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo-wrap">
    <img src="logo.png" alt="ECM" onerror="this.style.display='none'">
    <div class="app-title" id="appTitle">ECM Access Control</div>
    <div class="app-sub" id="welcomeMsg">Accedi per continuare</div>
  </div>

  <div class="alert alert-error" id="loginErr"></div>
  <div class="alert alert-info" id="loginInfo"></div>

  <!-- Login Email/Password -->
  <div class="form-group">
    <label class="field-label">Email</label>
    <input type="email" class="form-input" id="loginEmail" placeholder="email@esempio.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label class="field-label">Password</label>
    <div class="pwd-wrap">
      <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
      <button class="pwd-toggle" id="togglePwd" type="button">👁</button>
    </div>
    <div class="forgot-link"><a href="#" id="forgotLink">Password dimenticata?</a></div>
  </div>

  <button class="btn btn-primary" id="btnLogin">Accedi</button>

  <div class="divider"><span class="divider-text">oppure</span></div>

  <!-- Login Google (per admin esistenti) -->
  <button class="btn btn-google" id="btnGoogle">
    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    Accedi con Google
  </button>

  <div class="role-info">
    <span>ℹ️</span>
    <span>Admin e operatori usano email+password · Super Admin usa Google</span>
  </div>

  <div class="footer-login">
    ECM Access Control &copy; 2026 Multimedia Meeting Group
  </div>
</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const FB={apiKey:"AIzaSyBfq6dHq7JQRC2AtBf7obTM6End2NftwxA",authDomain:"ecm-access-control.firebaseapp.com",projectId:"ecm-access-control",storageBucket:"ecm-access-control.firebasestorage.app",messagingSenderId:"727782311741",appId:"1:727782311741:web:4aaf570b1a05caf4192754"};
const app = getApps().length ? getApps()[0] : initializeApp(FB);
const auth = getAuth(app);
const db = getFirestore(app);
const SUPER_ADMIN_EMAIL = 'martinsosem@gmail.com';

// Carica messaggio di benvenuto personalizzato
async function loadWelcome() {
  try {
    const cfg = await getDoc(doc(db,'sistema','config'));
    if(cfg.exists()) {
      const d = cfg.data();
      if(d.welcome) document.getElementById('welcomeMsg').textContent = d.welcome;
      if(d.nomeOrg) document.getElementById('appTitle').textContent = d.nomeOrg;
    }
  } catch(e) {}
}
loadWelcome();

// Toggle password
document.getElementById('togglePwd').addEventListener('click', function() {
  const i = document.getElementById('loginPassword');
  i.type = i.type==='password'?'text':'password';
  this.textContent = i.type==='password'?'👁':'🙈';
});

// Enter per submit
document.getElementById('loginPassword').addEventListener('keydown', e => {
  if(e.key==='Enter') document.getElementById('btnLogin').click();
});
document.getElementById('loginEmail').addEventListener('keydown', e => {
  if(e.key==='Enter') document.getElementById('loginPassword').focus();
});

// Login email/password
document.getElementById('btnLogin').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pwd = document.getElementById('loginPassword').value;
  if(!email||!pwd){showErr('Inserisci email e password.');return;}
  const btn = document.getElementById('btnLogin');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Accesso in corso...';
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pwd);
    // Verifica che l'account esista in Firestore e sia attivo
    const uDoc = await getDoc(doc(db,'utenti',cred.user.uid));
    if(uDoc.exists()) {
      const u = uDoc.data();
      if(u.stato==='sospeso') {
        await auth.signOut();
        showErr('Account sospeso. Contatta l\'amministratore.');
        return;
      }
      // Log accesso
      await logAccesso(email, u.ruolo||'utente');
      // Redirect in base al ruolo
      redirectByRole(u.ruolo, u.email);
    } else if(email===SUPER_ADMIN_EMAIL) {
      await logAccesso(email, 'superadmin');
      window.location.href = 'ecm-home.html';
    } else {
      // Utente non trovato in Firestore ma auth ok - accesso limitato
      window.location.href = 'ecm-home.html';
    }
  } catch(e) {
    const msg = {
      'auth/user-not-found':'Utente non trovato.',
      'auth/wrong-password':'Password errata.',
      'auth/invalid-email':'Email non valida.',
      'auth/too-many-requests':'Troppi tentativi. Riprova tra qualche minuto.',
      'auth/invalid-credential':'Credenziali non valide.'
    }[e.code] || 'Errore di accesso: '+e.message;
    showErr(msg);
  }
  finally { btn.disabled=false; btn.innerHTML='Accedi'; }
});

// Login Google (principalmente per Super Admin)
document.getElementById('btnGoogle').addEventListener('click', async () => {
  const btn = document.getElementById('btnGoogle');
  btn.disabled=true;
  try {
    const provider = new GoogleAuthProvider();
    const cred = await signInWithPopup(auth, provider);
    await logAccesso(cred.user.email, cred.user.email===SUPER_ADMIN_EMAIL?'superadmin':'google');
    window.location.href = cred.user.email===SUPER_ADMIN_EMAIL ? 'ecm-superadmin.html' : 'ecm-home.html';
  } catch(e) {
    if(e.code!=='auth/popup-closed-by-user') showErr('Errore Google: '+e.message);
  }
  finally { btn.disabled=false; }
});

// Password reset
document.getElementById('forgotLink').addEventListener('click', async e => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  if(!email){showErr('Inserisci prima la tua email.');return;}
  try {
    await sendPasswordResetEmail(auth, email);
    showInfo('Email di reset inviata a '+email+'. Controlla la casella.');
  } catch(e) { showErr('Errore: '+e.message); }
});

async function logAccesso(email, ruolo) {
  try {
    await addDoc(collection(db,'log_attivita'),{
      tipo:'login', email, ruolo,
      dettaglio:'Login: '+email+' ('+ruolo+')',
      ts:serverTimestamp(), data:new Date().toISOString(),
      ua:navigator.userAgent.slice(0,80)
    });
  } catch(e) {}
}

function redirectByRole(ruolo, email) {
  if(email===SUPER_ADMIN_EMAIL) { window.location.href='ecm-superadmin.html'; return; }
  switch(ruolo) {
    case 'scanner': window.location.href='ecm-blocco3.html'; break;
    case 'viewer': window.location.href='ecm-blocco4.html'; break;
    default: window.location.href='ecm-home.html';
  }
}

function showErr(msg){const e=document.getElementById('loginErr');e.textContent=msg;e.style.display='block';document.getElementById('loginInfo').style.display='none';}
function showInfo(msg){const e=document.getElementById('loginInfo');e.textContent=msg;e.style.display='block';document.getElementById('loginErr').style.display='none';}
</script>
</body>
</html>
